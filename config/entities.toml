# The entity taxonomy: 7 classes, each split into subclasses of known words.
#   entity     = living things and groups of people
#   location   = places of any size
#   object     = things you can hold, use, eat or ride
#   literature = writing: genres, forms, devices, authors
#   science    = physics, chemistry, biology, astronomy, earth
#   math       = arithmetic, algebra, geometry, calculus, statistics...
#   history    = eras, events, civilizations, institutions
#
# Lily files every mention of these words in your chats under class > subclass.
# It is a word list, so it cannot tell meanings apart (the word "mouse" is always a device).
# Plain everyday words are left out of the subject classes on purpose (no "force", "cell",
# "plot" or "limit"), because they would be filed by accident. Add your own if you want them.
# A word listed twice goes to the first place it appears. Code blocks are ignored.
#
# Add words here, or inside Lily: /entity add <word> <class>/<subclass>
# Subclasses are free: write a new line to make one. Then run /entity scan.

[entity]
person = ["mother", "father", "mom", "dad", "brother", "sister", "friend", "teacher", "doctor", "student", "engineer", "developer", "child", "baby", "king", "queen"]
animal = ["dog", "cat", "bird", "fish", "horse", "cow", "pig", "chicken", "duck", "rabbit", "snake", "lion", "tiger", "elephant", "monkey", "wolf", "fox", "frog", "bee", "carabao"]
plant = ["tree", "flower", "grass", "rose", "bamboo", "mango tree", "coconut tree", "cactus", "fern", "moss", "vine"]
organization = ["company", "school", "university", "government", "bank", "hospital", "team", "club", "army", "police", "church group"]

[location]
