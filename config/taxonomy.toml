# The universal data taxonomy. It only organizes and filters what Lily has stored:
# labels point at records (chats, notes...) and never change them.
#
# A record can carry several labels (one chat can be study/history AND geography/settlement).
# A record with no label is "unclassified". A label under "unknown/..." means
# "looked at, does not fit anywhere yet". Both are normal and nothing is lost.
# Overlap is fine: when a record fits two branches, give it both labels.
#
# Paths are lowercase words joined by "/": study/history/medieval (up to 6 levels).

# The four top-level categories. Changing this list is the only way to add a new one.
[roots]
entity = "Things that exist"
geography = "Places and spatial information"
nature = "Natural systems and phenomena"
study = "Knowledge, disciplines, discoveries, history, concepts and research"

# Broad second-level branches. Every branch needs a definition that no other branch shares.
# Go deeper any time, with no code change (study already has a third level):
#   inside Lily:  /taxonomy add study/history/medieval "the middle ages"
#   or here:      "study/history/medieval" = "the middle ages"
[sub]
# Entity: what exists or can be identified
"entity/living" = "Living things that are not a person, animal, plant or microorganism, such as fungi"
"entity/non-living" = "Non-living things that are neither made objects nor materials, such as stars, clouds and single rocks"
"entity/person" = "Individual people and their roles, such as a mother, a teacher or a king"
"entity/animal" = "Animals of any kind, wild or domestic"
"entity/plant" = "Plants of any kind, from grass to trees"
"entity/microorganism" = "Living things too small to see unaided, such as bacteria, protists and viruses"
"entity/object" = "Made or discrete things, such as devices, vehicles, tools, food and clothing"
"entity/material" = "What things are made of, such as metal, wood, plastic, cloth and stone"
"entity/organization" = "Formally structured bodies, such as companies, schools, governments and teams"
"entity/group" = "Informal collectives of people or things, such as a family, a crowd, a community or a flock"

# Geography: where something exists
"geography/continent" = "The continents and other very large world regions, such as Asia, Africa and Antarctica"
"geography/country-territory" = "Sovereign countries and dependent territories"
"geography/administrative-region" = "Parts of a country with their own government or purpose: provinces, states, districts and counties"
"geography/settlement" = "Places where people live together: cities, towns, villages and neighborhoods"
"geography/landform" = "Natural shapes of land: mountains, volcanoes, valleys, islands, deserts and caves"
"geography/water-body" = "Bodies and courses of water: oceans, seas, rivers, lakes and bays"
"geography/geographic-feature" = "Named features that mix or sit between land and water, such as coastlines, deltas, watersheds and mountain passes"
"geography/location" = "Specific places, venues and addresses, such as a house, an office, a park or an airport"
"geography/boundary" = "Borders and dividing lines, such as national borders, frontiers and jurisdiction limits"
"geography/spatial-relationship" = "How places relate in space: distance, direction, nearness and containment"

# Nature: natural systems, conditions and processes
"nature/ecosystem" = "A community of living things together with its environment, such as a forest or a coral reef"
"nature/habitat" = "The kind of place where a species lives, such as a wetland, a burrow or a canopy"
"nature/climate" = "Long-term weather patterns of a region, and how they change"
"nature/weather" = "Short-term atmospheric conditions such as rain, wind, storms and heat"
"nature/natural-phenomenon" = "Observable natural events, such as eclipses, auroras, earthquakes and lightning"
"nature/natural-process" = "Continuing natural change, such as erosion, the water cycle, photosynthesis and decay"
"nature/geological-system" = "The solid-Earth systems: plate tectonics, the rock cycle and volcanic activity"
"nature/natural-resource" = "Materials and energy that nature supplies, such as water, minerals, timber and wind"
"nature/environmental-condition" = "The state and health of an environment, such as air quality, pollution and soil condition"
"nature/biodiversity" = "The variety of life and its protection, including species richness and extinction"

# Study: areas of human knowledge and understanding
"study/history" = "The past and how we know it: eras, events, civilizations and institutions"
"study/science" = "Systematic study of the natural world: physics, chemistry, biology, astronomy and earth science"
"study/math" = "Mathematics: numbers, algebra, geometry, calculus, statistics and logic"
"study/philosophy" = "Questions of existence, knowledge, reason, ethics and meaning"
"study/culture" = "Shared ways of living: customs, traditions, festivals and identity"
"study/language" = "Human languages and linguistics: grammar, vocabulary, writing systems and translation"
"study/religion-belief" = "Religions, spiritual traditions and belief systems"
"study/arts-literature" = "Creative and expressive works: visual art, music, theater, film and literature"
"study/social-studies" = "How people and societies live and interact: sociology, anthropology, psychology and communities"
"study/political-studies" = "Government, power, law, policy and international relations"
"study/economics" = "Production, trade, money, markets, work and resources"
"study/medicine" = "Health, illness, treatment and the body: clinical practice and public health"
"study/technology" = "Applied tools and methods, including engineering, computing and programming"
"study/education" = "Teaching and learning: schools, methods, curricula and skills"
"study/research-discovery" = "How new knowledge is made: research methods, studies, experiments, inventions and discoveries"

# Study, third level: the main areas inside each branch. Ids already used by the older word lists
# (science/physics, math/algebra, history/era...) are kept as they were.
"study/history/era" = "Named periods of the past, such as the middle ages, the renaissance and the industrial revolution"
"study/history/event" = "Single events and wars, such as a revolution, a treaty signing or a world war"
"study/history/civilization" = "Societies, empires and cultures of the past, such as Rome, the Maya and the Ottomans"
"study/history/institution" = "Long-lived systems of rule and order, such as monarchy, parliament, feudalism and colonialism"
"study/history/historiography" = "How history is researched and written: sources, evidence and competing interpretations"
"study/history/archaeology" = "Learning about the past from physical remains: sites, artifacts and excavations"
"study/science/physics" = "Matter, energy, motion and forces: gravity, electricity, magnetism, quantum physics and relativity"
"study/science/chemistry" = "Substances and how they change: atoms, molecules, reactions and the periodic table"
"study/science/biology" = "Living things and life processes: cells, genes, evolution, organisms and bodily systems"
"study/science/astronomy" = "Space and everything in it: planets, stars, galaxies, black holes and cosmology"
"study/science/earth" = "The planet as a science: geology, oceans, atmosphere, climate science and natural hazards"
"study/science/environmental-science" = "How living things and their surroundings interact, including human impact and sustainability"
"study/math/arithmetic" = "Basic number work: addition, subtraction, multiplication, division, fractions and percentages"
"study/math/algebra" = "Working with symbols and equations: variables, polynomials, exponents and logarithms"
"study/math/geometry" = "Shapes, sizes, space and angles: triangles, circles, polygons and measurement"
"study/math/trigonometry" = "Angles and triangles through sine, cosine and tangent, and periodic functions"
"study/math/calculus" = "Change and accumulation: limits, derivatives, integrals and differential equations"
"study/math/statistics" = "Collecting and interpreting data: probability, distributions, correlation and hypothesis tests"
"study/math/linear-algebra" = "Vectors, matrices and linear transformations"
"study/math/logic" = "Valid reasoning and proof: propositions, truth tables, proof techniques and formal systems"
"study/math/discrete-math" = "Counting and structure: sets, combinatorics, graphs and number theory"
"study/philosophy/metaphysics" = "What reality is: existence, time, causation, identity and free will"
"study/philosophy/epistemology" = "What knowledge is and how we get it: belief, truth, evidence and skepticism"
"study/philosophy/ethics" = "Right and wrong: moral theories, duty, virtue and how we ought to live"
"study/philosophy/aesthetics" = "Beauty, art and taste: what makes something beautiful or artistic"
"study/philosophy/philosophy-of-mind" = "Mind and consciousness: thought, perception, the self and the mind-body problem"
"study/philosophy/philosophical-tradition" = "Schools and thinkers, such as Stoicism, existentialism, empiricism and Confucian thought"
"study/culture/tradition" = "Customs passed down in a community: rites of passage, etiquette, manners and everyday practice"
"study/culture/festival" = "Celebrations and holidays, such as national days, harvest festivals and seasonal feasts"
"study/culture/cuisine" = "Food as culture: regional dishes, cooking traditions and the customs around meals"
"study/culture/folklore" = "Stories, sayings, legends and beliefs of a people, handed down by word of mouth"
"study/culture/popular-culture" = "Mass entertainment and trends: celebrities, fashion, games, internet culture and fandom"
"study/culture/cultural-heritage" = "What a society preserves from its past: monuments, museums, crafts and traditions at risk"
"study/language/linguistics" = "The scientific study of language: sounds, structure, meaning and how language changes"
"study/language/grammar" = "Rules of a language: word forms, sentence structure, punctuation and usage"
"study/language/vocabulary" = "Words and their meanings: definitions, word origins, idioms and slang"
"study/language/writing-system" = "How languages are written: alphabets, scripts, characters and spelling"
"study/language/translation" = "Moving meaning between languages: translating, interpreting and comparing languages"
"study/language/language-learning" = "Learning a language: methods, practice, fluency and common mistakes"
"study/religion-belief/world-religion" = "The major faiths and their history, teachings and communities"
"study/religion-belief/scripture" = "Sacred and foundational texts of religions, and how they are interpreted"
"study/religion-belief/ritual-practice" = "Worship, prayer, pilgrimage, observances and religious law"
"study/religion-belief/theology" = "Reasoned study of God, the divine and religious doctrine"
"study/religion-belief/spirituality" = "Personal spiritual life and meaning beyond organized religion: meditation, mysticism and the sacred"
"study/religion-belief/secular-belief" = "Non-religious worldviews, such as atheism, agnosticism and humanism"
"study/arts-literature/visual-art" = "Painting, drawing, sculpture, photography and other art made to be seen"
"study/arts-literature/music" = "Sound as art: songs, instruments, composition, genres and music theory"
"study/arts-literature/performing-art" = "Live art by performers: theater, dance, opera and spoken performance"
"study/arts-literature/film-media" = "Moving image and broadcast: film, television, animation and video"
"study/arts-literature/architecture" = "Designing buildings and spaces: styles, famous structures and building design"
"study/arts-literature/craft" = "Handmade and applied arts: pottery, weaving, woodwork and decorative work"
"study/arts-literature/art-criticism" = "Judging and explaining art: reviews, art movements and critical theory"
"study/social-studies/sociology" = "How societies are organized: class, family, institutions, groups and social change"
"study/social-studies/anthropology" = "Humans across cultures and time: kinship, rituals, human origins and ways of life"
"study/social-studies/psychology" = "Mind and behavior: learning, memory, emotion, personality and development"
"study/social-studies/social-issue" = "Problems affecting groups of people: poverty, inequality, discrimination and migration"
"study/social-studies/community" = "Local and group life: neighborhoods, volunteering, civic groups and social ties"
"study/social-studies/demography" = "Populations: size, growth, age, birth and death rates and migration patterns"
"study/political-studies/government" = "How states are run: branches, offices, systems of government and public administration"
"study/political-studies/political-ideology" = "Systems of political belief, such as liberalism, socialism, conservatism and nationalism"
"study/political-studies/law" = "Rules a society enforces: constitutions, statutes, courts, rights and legal systems"
"study/political-studies/public-policy" = "Government choices on issues such as health, education, taxes and the environment"
"study/political-studies/international-relations" = "How countries deal with each other: diplomacy, treaties, alliances, conflict and global bodies"
"study/political-studies/election" = "How leaders and decisions are chosen: voting systems, campaigns, parties and results"
"study/economics/microeconomics" = "Individual choices and markets: supply and demand, prices, firms and consumers"
"study/economics/macroeconomics" = "The whole economy: growth, inflation, unemployment, national income and policy"
"study/economics/finance" = "Money over time: banking, investing, saving, credit, insurance and financial markets"
"study/economics/trade" = "Buying and selling between people and countries: commerce, tariffs, supply chains and exchange"
"study/economics/labor" = "Work and wages: jobs, employment, skills, unions and the labor market"
"study/economics/business-management" = "Running a business: strategy, operations, marketing, entrepreneurship and leadership"
"study/medicine/anatomy-physiology" = "The structure and workings of the body: organs, systems and normal function"
"study/medicine/disease" = "Illness and its causes: infections, chronic conditions, symptoms and diagnosis"
"study/medicine/treatment" = "Care and cure: surgery, therapy, procedures, rehabilitation and emergency care"
"study/medicine/pharmacology" = "Medicines and drugs: how they work, doses, side effects and interactions"
"study/medicine/public-health" = "Health of populations: epidemics, vaccination, sanitation and prevention"
"study/medicine/mental-health" = "Emotional and psychological wellbeing, and care for mental illness"
"study/medicine/nutrition" = "Food and the body: diet, vitamins, minerals and healthy eating"
"study/technology/engineering" = "Designing and building with science: civil, mechanical, electrical and chemical engineering"
"study/technology/electronics" = "Circuits and electronic parts: sensors, chips, power and signal systems"
"study/technology/energy" = "Making, storing and moving power: fuels, electricity, solar, wind and batteries"
"study/technology/manufacturing" = "Making goods at scale: factories, machines, materials processing and quality"
"study/technology/transportation" = "Moving people and goods: vehicles, aviation, shipping, rail and road systems"
"study/technology/communication" = "Carrying information: telecommunications, broadcasting, satellites and radio"
"study/technology/biotechnology" = "Using living systems to make products: genetic engineering, fermentation and lab methods"
"study/technology/robotics-automation" = "Machines that act on their own: robots, drones, control systems and automation"
"study/education/teaching-method" = "How to teach: lesson planning, classroom approaches and instructional techniques"
"study/education/curriculum" = "What is taught: subjects, standards, syllabi and course design"
"study/education/learning-theory" = "How people learn: memory, motivation, development and educational psychology"
"study/education/study-skill" = "How to study well: note-taking, memorizing, time management and exam preparation"
"study/education/assessment" = "Measuring learning: tests, grading, feedback and certification"
"study/education/school-system" = "How education is organized: schools, universities, levels, funding and access"
"study/research-discovery/research-method" = "How to do research: designing studies, sampling, surveys, sources and ethics"
"study/research-discovery/experiment" = "Testing ideas under controlled conditions: setups, variables, results and replication"
"study/research-discovery/discovery" = "Findings that add new knowledge, such as new species, particles, planets or fossils"
"study/research-discovery/invention" = "New devices and methods and who made them: patents, prototypes and breakthroughs"
"study/research-discovery/theory" = "Explanations that tie evidence together, such as evolution, relativity and plate tectonics"
"study/research-discovery/publication" = "Sharing research: papers, journals, peer review, citations and conferences"

# Older ids that now mean the same thing as a new branch. Nothing stored is rewritten:
# records under the old id are found under the new one, and new labels use the new one.
[alias]
"nature/animal" = "entity/animal"
"nature/plant" = "entity/plant"
"geography/country" = "geography/country-territory"
"geography/city" = "geography/settlement"
"geography/region" = "geography/administrative-region"
"geography/water" = "geography/water-body"
"geography/place" = "geography/location"

# Older branches that keep their id and sit inside a broader branch: they are drawn under it
# and their records count toward it.
[inside]
"study/literature" = "study/arts-literature"
"study/computing" = "study/technology"
"study/programming" = "study/technology"

# How the older word-list taxonomy (/entity) and code blocks (/code) feed this one.
# "class" sends every subclass below it (entity/person -> entity/person);
# "class/sub" sends one subclass to an exact path. Longest key wins.
# Anything not listed lands in unknown/<class>. "code" is any chat that has a code block.
[legacy]
entity = "entity"
object = "entity/object"
location = "geography"
"location/country" = "geography/country-territory"
"location/city" = "geography/settlement"
"location/region" = "geography/administrative-region"
"location/water" = "geography/water-body"
"location/landform" = "geography/landform"
"location/place" = "geography/location"
literature = "study/literature"
science = "study/science"
math = "study/math"
history = "study/history"
computing = "study/computing"
programming = "study/programming"
code = "study/programming"
