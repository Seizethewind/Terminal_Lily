# Lily herself: router, workload tiers, roles and limits.
# Keys never go in this file: key_env names the variable in .env.
# [workers] is the router for Lily and her workers. [local] is the Ollama fallback: Lily starts
# it herself (models in data/models) and only when the router fails. Turn either off in .env.

[workers]   # the router for Lily's chat and her background workers
url = "https://lilyaiapi.onrender.com/v1"
key_env = "LILY_API_KEY"

[local]     # Ollama on this phone: only used when the router fails or there is no internet.
url = "http://127.0.0.1:11434/v1"
model = "lily_ai:0.1"   # Lily_Ai 0.1: create it with scripts/setup_local_ai.sh
timeout = 180          # a small model can be slow on a phone

[tiers]     # workload tier -> model string sent to the router
light = "auto:fast"
normal = "auto"
heavy = "auto:smart"

[roles]     # role -> usual tier (any role name works; "default" is the fallback)
default = "normal"
researcher = "normal"
coder = "heavy"
summarizer = "light"

[limits]
max_workers = 3      # workers at once (busy = one tier lighter)
worker_steps = 6     # think/act steps per worker
approval_wait = 120  # seconds a worker waits for your answer, then it counts as no
breaker_fails = 3    # failures in a row before a router is skipped for a while
breaker_pause = 60   # seconds a failing router is skipped
recent_turns = 6     # turns from earlier sessions Lily is reminded of
timeout = 60         # seconds to wait for a router

[personality]
text = ""            # leave empty for the built-in character
