# Automatic filing of chats by what they talk about (see lily/memory/taxonomy/autolabel.py).
#
# After each chat, Lily looks for the NAMES of the categories in config/taxonomy.toml, from the
# third level down (optics, genetics, cartography...). A name found in your message counts 2,
# in her answer 1, and a category needs 2 to be filed. Code is ignored. At most `max_labels` per chat.
# Labels made this way are marked "auto:tree"; your own labels always win and are never touched.
#
# It matches names only, so it prefers missing a chat to filing it wrongly.

max_labels = 6

# Names too common in everyday or programming talk to file on their own ("a model", "the stars").
# Remove one from this list if you want it filed, or add your own.
skip = [
    "model", "inference", "distribution", "vector", "matrix", "sets", "limits", "sampling", "sensor",
    "circuit", "journal", "conference", "citation", "feedback", "strategy", "operations", "leadership",
    "career", "workplace", "exam", "wage", "survey", "identity", "knowledge", "truth", "existence",
    "motivation", "composition", "instrument", "people", "objects", "groups", "materials", "plants",
    "classification", "navigation", "trend", "sport", "gaming", "fashion", "legend", "portfolio",
    "stars", "war", "rail", "wireless", "modern", "ancient", "contemporary", "commentary", "doctrine",
    "interpretation", "interpreting", "injury", "lecture", "grading", "satellite", "prototype",
    "family", "company", "tool", "toy", "crowd", "vehicle", "wood", "metal", "flower", "herb", "coast",
    "forest", "bird", "mammal", "soil", "island", "mountain", "cave", "crop", "vehicle", "device-gadget",
    "planet", "moon", "sun", "triangle", "circle", "polygon", "attention", "zen", "mutation", "inheritance",
    "cloning", "entropy", "optimization", "decision-making", "problem-solving", "dynamics", "statics",
    "childhood", "infancy",
    # entertainment branch: generic words that would file chats wrongly
    "convention", "quality-assurance", "bug-tracking", "performance-profiling", "engine-architecture",
    "dialogue-system", "discord-server", "forum-board", "community-moderation", "content-creator",
    "live-streaming", "queue-system", "resource-management", "controls-scheme", "accessibility-options",
    "menu-flow", "touch-controls", "battery-performance", "premium-purchase", "league-season",
    "category-rules", "unlock-system", "power-cost", "technology-level", "story-arc", "pacing-flow",
    "background-music", "limited-edition", "sound-effects", "motion-tracking", "recording-session",
    "online-community", "serialization", "publishing-deal", "training-regimen",
]

